<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>测试页面</title>
    <style>
        body {
            background: #0a0a0f;
            color: white;
            padding: 20px;
            font-family: sans-serif;
        }
        .test-button {
            padding: 20px 40px;
            font-size: 24px;
            background: linear-gradient(to right, #d300c5, #ff2a6d);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(211, 0, 197, 0.8);
        }
        .test-button:hover {
            opacity: 0.9;
            box-shadow: 0 0 30px rgba(211, 0, 197, 0.9);
        }
    </style>
</head>
<body>
    <h1>AI按钮测试</h1>
    <p>如果下面的按钮能正常显示，说明CSS和HTML没有问题：</p>
    <button class="test-button" onclick="alert('按钮正常工作！')">
        ⚡ AI调酒
    </button>
    <p>请按 F12 打开开发者工具，检查Console是否有错误。</p>
</body>
</html>
